<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!--
      Self-hosted rather than Google's CDN: two fewer connections to set up on
      a 4G handshake, no third-party request carrying the player's IP, and the
      files come off the same CDN as the game. latin-ext is not optional —
      the rupee sign (U+20B9) lives there, and it's on every screen.
    -->
    <link rel="preload" href="./fonts/honk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/geist-pixel-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="Drive an auto through Bangalore. Pick up riders, drop them at their stops, and see how many you can fit before it tips." />
    <title>Riksha — how many can you fit?</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      /* touch-action:none stops the browser eating swipes as scroll / pull-to-refresh */
      #app { width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; }
      canvas { display: block; }
    </style>
    <style>
      /*
        Honk is a COLRv1 chromatic font — it carries its own palette, so any
        fill colour set on the canvas is ignored. Used for the wordmark only.
        MORF defaults to 15, which is the instance we want, so no
        font-variation-settings are needed (and canvas couldn't apply them
        anyway — ctx.font is a shorthand that has no slot for them).
      */
      @font-face {
        font-family: 'Honk';
        src: url('./fonts/honk-latin.woff2') format('woff2');
        font-weight: 400;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Geist Pixel';
        src: url('./fonts/geist-pixel-latin.woff2') format('woff2');
        font-weight: 400;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Geist Pixel';
        src: url('./fonts/geist-pixel-latin-ext.woff2') format('woff2');
        font-weight: 400;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url('./fonts/dm-sans-latin.woff2') format('woff2');
        font-weight: 100 1000;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'DM Sans';
        src: url('./fonts/dm-sans-latin-ext.woff2') format('woff2');
        font-weight: 100 1000;
        font-display: block;
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
